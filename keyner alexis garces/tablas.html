<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Ingresos</title>
    <style>
        table {
            border-collapse: collapse;
            font-size: 18px;
            margin: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 12px 25px;
            text-align: center;
        }
    </style>
</head>
<body>

    <table border="1">
        <caption><strong>Ingresos</strong></caption>
        <tr>
            <th colspan="2">2012</th>
        </tr>
        <tr>
            <th rowspan="2">Enero</th>
            <td>100€</td>
        </tr>
        <tr>
            <td>50€</td>
        </tr>
        <tr>
            <th>Febrero</th>
            <td>75€</td>
        </tr>
    </table>
    <a href="index.html">

         ir a inicio
    </a>

</body>
</html>
